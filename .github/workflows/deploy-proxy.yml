name: Deploy Transcription Proxy

on:
  push:
    branches: [main]
    paths:
      - 'proxy/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm test

  deploy:
    # A red test run must not reach production. PR checks live in ci.yml.
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      # Schema first, so the new Worker never runs against an old database.
      # Already-applied migrations are skipped. The token needs D1 Edit.
      - run: npx wrangler d1 migrations apply ramble-relay --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `d1 migrations apply` runs its queries in JSON mode, which mutes
      # Wrangler's console logger, so a Cloudflare API error (bad token
      # permissions, for one) exits 1 with no message. The log file keeps it.
      - name: Show Wrangler logs
        if: failure()
        run: cat ~/.config/.wrangler/logs/*.log || true
