name = "ramble-transcription-proxy"
main = "src/worker.js"
compatibility_date = "2024-12-01"
# account_id is set via CLOUDFLARE_ACCOUNT_ID env var in CI

[observability]
enabled = true

[vars]
# Relay: transcripts are deleted when the agent acks them, or after this many
# seconds if never picked up (30 days).
RETENTION_SECONDS = "2592000"
APPLE_BUNDLE_ID = "dev.goodloop.Ramble"
# Early subscribers' product: accepted only as early-buyer proof.
PREMIUM_PRODUCT_ID = "dev.goodloop.ramble.premium.monthly2"
# The one-time unlock (non-consumable).
UNLOCK_PRODUCT_ID = "dev.goodloop.ramble.unlock"
# App Store environment whose server notifications this relay accepts.
APPSTORE_ENVIRONMENT = "Production"
# Set at release (see specs/purchase.md "Early buyers"):
#   FIRST_FREE_BUILD  build number of the first free-notes build, e.g. "120".
#                     Downloads from a lower build are early buyers.
#   LEGACY_UNTIL      ISO date old builds' POST /transcribe and text POST /inbox
#                     stop working (410), by default 60 days after release.
# FIRST_FREE_BUILD = ""
# LEGACY_UNTIL = ""
# Public base URL used in hook pings' pull_url when no request is in flight.
RELAY_BASE_URL = "https://ramble-transcription-proxy.jpoliachik.workers.dev"

# KV namespace for App Attest state (challenges, attested device keys).
[[kv_namespaces]]
binding = "ATTEST_KV"
id = "25ac690e38ad498f819f70192ce40a95"

# --- Relay (see RELAY.md) ---
# Every minute: transcription retries and stalled attempts (picked up within
# a minute of going stale), expiry, audio cleanup, operator alerts, and the
# 14:00 UTC daily summary.
[triggers]
crons = ["* * * * *"]

# Relay queues, connections, pairing codes. Until this binding exists the
# relay endpoints answer 503 and the transcription proxy is unaffected.
# New migrations: `npx wrangler d1 migrations apply ramble-relay --remote`.
[[d1_databases]]
binding = "DB"
database_name = "ramble-relay"
database_id = "828af171-e0a8-4f99-86e1-30d464ab6409"
migrations_dir = "migrations"

# Note audio, stored only until the note is transcribed (or fails for good).
# SETUP (Justin): create the bucket before deploying, private, with a 1-day
# lifecycle rule as the backstop for failed deletes:
#   npx wrangler r2 bucket create ramble-audio
#   then add an object lifecycle rule deleting objects after 1 day
#   (dashboard: R2 > ramble-audio > Settings > Object lifecycle rules).
# Deploys fail until the bucket exists.
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "ramble-audio"
